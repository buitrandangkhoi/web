<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grammar Workspace</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #fdf6ec;
  --surface: #f5ead8;
  --surface2: #fff8f0;
  --text: #201e1d;
  --text2: #4a4340;
  --muted: #7a6f67;
  --accent: #c67139;
  --accent-lt: #fdf0e6;
  --accent-dk: #9e5728;
  --green: #2e7d32;
  --green-lt: #e8f5e9;
  --red: #c62828;
  --red-lt: #ffebee;
  --blue: #1565c0;
  --blue-lt: #e3f2fd;
  --border: rgba(32,30,29,0.14);
  --shadow: 0 2px 8px rgba(32,30,29,0.10);
  --r: 12px;
  --font: 'Figtree', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1a1410; --surface: #252018; --surface2: #2e2720;
    --text: #f0e8dc; --text2: #c0b4a8; --muted: #8a7e76;
    --accent: #e08040; --accent-lt: #3a2010; --accent-dk: #f0a060;
    --green-lt: #0a2a0c; --red-lt: #2a0a0a; --blue-lt: #0a1a2e;
    --border: rgba(240,232,220,0.12);
  }
}
:root[data-theme="dark"] {
  --bg: #1a1410; --surface: #252018; --surface2: #2e2720;
  --text: #f0e8dc; --text2: #c0b4a8; --muted: #8a7e76;
  --accent: #e08040; --accent-lt: #3a2010; --accent-dk: #f0a060;
  --green-lt: #0a2a0c; --red-lt: #2a0a0a; --blue-lt: #0a1a2e;
  --border: rgba(240,232,220,0.12);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100%;
  padding: env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);
}

/* ── Header ── */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 14px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  position: sticky;
  top: env(safe-area-inset-top,0px);
  z-index: 100;
}
.back-btn {
  text-decoration: none;
  color: var(--accent);
  font-weight: 600;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 6px 10px;
  border-radius: 8px;
  transition: background .15s;
}
.back-btn:hover { background: var(--accent-lt); }
.header-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--text);
  flex: 1;
}
.header-title span { color: var(--accent); }

/* ── Page tabs ── */
.page-tabs {
  display: flex;
  background: var(--surface);
  border-bottom: 2px solid var(--border);
  padding: 0 20px;
  gap: 4px;
}
.page-tab {
  padding: 12px 20px;
  font-size: 15px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 3px solid transparent;
  margin-bottom: -2px;
  transition: color .15s, border-color .15s;
  font-family: var(--font);
}
.page-tab.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}
.page-tab:hover:not(.active) { color: var(--text2); }

/* ── Page content ── */
.page { display: none; padding: 20px; max-width: 860px; margin: 0 auto; }
.page.active { display: block; }

/* ── Level filter bar ── */
.level-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
  align-items: center;
}
.level-bar label { font-size: 14px; color: var(--muted); font-weight: 500; margin-right: 4px; }
.lvl-btn {
  padding: 6px 16px;
  border-radius: 20px;
  border: 1.5px solid var(--border);
  background: var(--surface2);
  color: var(--text2);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all .15s;
  font-family: var(--font);
}
.lvl-btn.active {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
}
.lvl-btn:hover:not(.active) { border-color: var(--accent); color: var(--accent); }

/* ── Theory: chapter cards ── */
.chapter-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 12px;
  overflow: hidden;
  box-shadow: var(--shadow);
}
.chapter-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  cursor: pointer;
  user-select: none;
  transition: background .15s;
}
.chapter-head:hover { background: var(--accent-lt); }
.ch-num {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.ch-title { font-size: 15px; font-weight: 600; flex: 1; }
.ch-badge {
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  border-radius: 10px;
  background: var(--accent-lt);
  color: var(--accent);
}
.ch-arrow { color: var(--muted); font-size: 18px; transition: transform .2s; }
.chapter-card.open .ch-arrow { transform: rotate(180deg); }
.chapter-body { display: none; padding: 0 16px 16px; }
.chapter-card.open .chapter-body { display: block; }

/* ── Theory content blocks ── */
.theory-block { margin-top: 12px; }
.theory-block h4 {
  font-size: 14px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .5px;
}
.theory-block p { font-size: 14px; line-height: 1.7; color: var(--text2); margin-bottom: 8px; }
.theory-block ul { padding-left: 18px; }
.theory-block li { font-size: 14px; line-height: 1.7; color: var(--text2); margin-bottom: 4px; }
.formula-box {
  background: var(--blue-lt);
  border-left: 3px solid var(--blue);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 14px;
  font-family: monospace;
  color: var(--blue);
  margin: 8px 0;
  white-space: pre-wrap;
  word-break: break-word;
}
.note-box {
  background: var(--accent-lt);
  border-left: 3px solid var(--accent);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text2);
  margin: 8px 0;
}
.note-box strong { color: var(--accent); }
.example-box {
  background: var(--green-lt);
  border-left: 3px solid var(--green);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
  color: var(--text2);
  margin: 8px 0;
}
.example-box strong { color: var(--green); }
.table-wrap { overflow-x: auto; margin: 10px 0; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th { background: var(--accent); color: #fff; padding: 8px 10px; text-align: left; font-weight: 600; }
td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--text2); }
tr:last-child td { border-bottom: none; }
tr:nth-child(even) td { background: var(--surface); }

/* ── Progress bar ── */
.progress-wrap { margin-bottom: 18px; }
.progress-top { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
.progress-bar { height: 8px; background: var(--surface); border-radius: 4px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent); border-radius: 4px; transition: width .4s; }

/* ── MCQ ── */
.ex-section-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text);
  margin: 20px 0 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid var(--border);
}
.mcq-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.mcq-num { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.mcq-q { font-size: 15px; font-weight: 600; margin-bottom: 12px; line-height: 1.5; }
.mcq-opts { display: flex; flex-direction: column; gap: 8px; }
.mcq-opt {
  padding: 10px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  font-size: 14px;
  color: var(--text2);
  transition: all .15s;
  text-align: left;
  font-family: var(--font);
  line-height: 1.5;
}
.mcq-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-lt); color: var(--accent); }
.mcq-opt.correct { border-color: var(--green); background: var(--green-lt); color: var(--green); font-weight: 600; }
.mcq-opt.wrong { border-color: var(--red); background: var(--red-lt); color: var(--red); }
.mcq-opt:disabled { cursor: not-allowed; opacity: .85; }
.mcq-feedback {
  margin-top: 12px;
  padding: 12px 14px;
  border-radius: 8px;
  font-size: 13px;
  line-height: 1.7;
  display: none;
}
.mcq-feedback.show { display: block; }
.mcq-feedback.correct-fb { background: var(--green-lt); border-left: 3px solid var(--green); color: var(--text2); }
.mcq-feedback.wrong-fb { background: var(--red-lt); border-left: 3px solid var(--red); color: var(--text2); }
.fb-label { font-weight: 700; margin-bottom: 4px; }
.fb-label.ok { color: var(--green); }
.fb-label.no { color: var(--red); }

/* ── Sentence exercises ── */
.sent-card {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--r);
  padding: 16px;
  margin-bottom: 14px;
  box-shadow: var(--shadow);
}
.sent-num { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
.sent-q { font-size: 14px; color: var(--text2); margin-bottom: 12px; line-height: 1.6; }
.sent-q strong { color: var(--accent); }
.drop-zone {
  min-height: 44px;
  border: 2px dashed var(--border);
  border-radius: 8px;
  padding: 8px 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  background: var(--surface);
  margin-bottom: 10px;
  cursor: pointer;
  transition: border-color .15s;
}
.drop-zone:hover { border-color: var(--accent); }
.drop-zone .placed-word {
  background: var(--accent);
  color: #fff;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 13px;
  cursor: pointer;
  transition: opacity .15s;
}
.drop-zone .placed-word:hover { opacity: .8; }
.drop-zone .zone-hint { color: var(--muted); font-size: 13px; }
.word-bank { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.word-chip {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: 6px;
  padding: 5px 12px;
  font-size: 13px;
  cursor: pointer;
  color: var(--text2);
  transition: all .15s;
  font-family: var(--font);
}
.word-chip:hover:not(.used) { border-color: var(--accent); background: var(--accent-lt); color: var(--accent); }
.word-chip.used { opacity: .35; cursor: not-allowed; pointer-events: none; }
.sent-actions { display: flex; gap: 8px; margin-bottom: 10px; }
.btn-check {
  padding: 8px 18px;
  border-radius: 8px;
  border: none;
  background: var(--accent);
  color: #fff;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  font-family: var(--font);
  transition: background .15s;
}
.btn-check:hover { background: var(--accent-dk); }
.btn-reset {
  padding: 8px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--text2);
  font-size: 13px;
  cursor: pointer;
  font-family: var(--font);
  transition: all .15s;
}
.btn-reset:hover { border-color: var(--accent); color: var(--accent); }
.sent-feedback {
  font-size: 13px;
  line-height: 1.7;
  padding: 10px 14px;
  border-radius: 8px;
  display: none;
}
.sent-feedback.show { display: block; }
.sent-feedback.ok { background: var(--green-lt); border-left: 3px solid var(--green); color: var(--text2); }
.sent-feedback.no { background: var(--red-lt); border-left: 3px solid var(--red); color: var(--text2); }

/* ── Reset all btn ── */
.reset-all-wrap { text-align: right; margin-bottom: 14px; }
.btn-reset-all {
  padding: 7px 16px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-size: 13px;
  cursor: pointer;
  font-family: var(--font);
  transition: all .15s;
}
.btn-reset-all:hover { border-color: var(--red); color: var(--red); }

/* ── Responsive ── */
@media (max-width: 480px) {
  .page { padding: 14px 12px; }
  .page-tabs { padding: 0 12px; }
  .page-tab { padding: 10px 14px; font-size: 14px; }
  .site-header { padding: 12px; }
  .header-title { font-size: 16px; }
}
</style>
</head>
<body>

<header class="site-header">
  <a class="back-btn" href="index.html">← Trang chủ</a>
  <div class="header-title">📚 <span>Ngữ pháp</span> Tiếng Anh</div>
</header>

<nav class="page-tabs">
  <button class="page-tab active" onclick="switchPage('theory',this)">📖 Lý thuyết</button>
  <button class="page-tab" onclick="switchPage('practice',this)">✏️ Luyện tập</button>
</nav>

<!-- ════════════════ THEORY PAGE ════════════════ -->
<div id="page-theory" class="page active">
  <div class="level-bar">
    <label>Cấp độ:</label>
    <button class="lvl-btn active" onclick="filterTheory('all',this)">Tất cả</button>
    <button class="lvl-btn" onclick="filterTheory('a1a2',this)">A1–A2</button>
    <button class="lvl-btn" onclick="filterTheory('b1b2',this)">B1–B2</button>
    <button class="lvl-btn" onclick="filterTheory('c1c2',this)">C1–C2</button>
  </div>
  <div id="theory-list"></div>
</div>

<!-- ════════════════ PRACTICE PAGE ════════════════ -->
<div id="page-practice" class="page">
  <div class="level-bar">
    <label>Cấp độ:</label>
    <button class="lvl-btn active" onclick="filterExercises('a1a2',this)">A1–A2</button>
    <button class="lvl-btn" onclick="filterExercises('b1b2',this)">B1–B2</button>
    <button class="lvl-btn" onclick="filterExercises('c1c2',this)">C1–C2</button>
  </div>
  <div class="progress-wrap">
    <div class="progress-top">
      <span id="prog-label">0 / 25 câu hoàn thành</span>
      <span id="prog-pct">0%</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog-fill" style="width:0"></div></div>
  </div>
  <div class="reset-all-wrap">
    <button class="btn-reset-all" onclick="resetAll()">🔄 Làm lại tất cả</button>
  </div>
  <div id="practice-list"></div>
</div>

<script>
// ══════════════════════════════════════════════
// DATA — THEORY
// ══════════════════════════════════════════════
const CHAPTERS = [
  // ── A1–A2 ──
  {
    num: 1, level: 'a1a2',
    title: 'Cấu trúc câu cơ bản S + V + O',
    content: `
<div class="theory-block">
  <h4>Cấu trúc</h4>
  <div class="formula-box">S (Subject) + V (Verb) + O (Object/Complement)</div>
  <p>Câu tiếng Anh bắt buộc phải có <strong>Chủ ngữ (S)</strong> và <strong>Động từ (V)</strong>. Không bao giờ bỏ chủ ngữ.</p>
</div>
<div class="theory-block">
  <h4>Ví dụ</h4>
  <div class="example-box"><strong>Ví dụ:</strong><br>
  • I study English every day.<br>
  • She likes coffee.<br>
  • They play football.
  </div>
</div>
<div class="theory-block">
  <h4>Chú ý — Lỗi Vietnglish thường gặp</h4>
  <div class="note-box"><strong>⚠️</strong> Không nói: <em>"Is hot today"</em> → Phải nói: <em>"It is hot today."</em><br>
  Không nói: <em>"Have a dog."</em> → Phải nói: <em>"I have a dog."</em></div>
</div>`
  },
  {
    num: 2, level: 'a1a2',
    title: 'Danh từ — Countable & Uncountable',
    content: `
<div class="theory-block">
  <h4>Danh từ đếm được (Countable Nouns)</h4>
  <p>Có thể đếm được, có số ít và số nhiều.</p>
  <div class="formula-box">a/an + N (số ít) | N + s/es (số nhiều)</div>
  <div class="example-box"><strong>Ví dụ:</strong> a book → books | a box → boxes | a child → children | a man → men</div>
</div>
<div class="theory-block">
  <h4>Quy tắc thêm -s / -es</h4>
  <ul>
    <li>Thêm <strong>-es</strong>: kết thúc bằng -s, -x, -sh, -ch, -o → buses, boxes, dishes, watches, tomatoes</li>
    <li>Đuôi <strong>-y</strong> (trước phụ âm) → đổi thành <strong>-ies</strong>: baby → babies, city → cities</li>
    <li>Đuôi <strong>-f/-fe</strong> → đổi thành <strong>-ves</strong>: leaf → leaves, wife → wives</li>
    <li>Bất quy tắc: man→men, woman→women, child→children, tooth→teeth, foot→feet, mouse→mice</li>
  </ul>
</div>
<div class="theory-block">
  <h4>Danh từ không đếm được (Uncountable Nouns)</h4>
  <p>Không có số nhiều, không dùng a/an.</p>
  <div class="example-box"><strong>Ví dụ:</strong> water, milk, rice, bread, information, advice, money, music, weather</div>
  <div class="note-box"><strong>⚠️</strong> KHÔNG nói: <em>"an information"</em>, <em>"advices"</em>. Dùng: <em>some information, a piece of advice</em></div>
</div>`
  },
  {
    num: 3, level: 'a1a2',
    title: 'Đại từ — Nhân xưng, Sở hữu',
    content: `
<div class="theory-block">
  <h4>Bảng đại từ</h4>
  <div class="table-wrap"><table>
    <tr><th>Chủ ngữ</th><th>Tân ngữ</th><th>Sở hữu tính từ</th><th>Sở hữu đại từ</th></tr>
    <tr><td>I</td><td>me</td><td>my</td><td>mine</td></tr>
    <tr><td>you</td><td>you</td><td>your</td><td>yours</td></tr>
    <tr><td>he</td><td>him</td><td>his</td><td>his</td></tr>
    <tr><td>she</td><td>her</td><td>her</td><td>hers</td></tr>
    <tr><td>it</td><td>it</td><td>its</td><td>—</td></tr>
    <tr><td>we</td><td>us</td><td>our</td><td>ours</td></tr>
    <tr><td>they</td><td>them</td><td>their</td><td>theirs</td></tr>
  </table></div>
</div>
<div class="theory-block">
  <h4>Sở hữu cách ('s)</h4>
  <div class="formula-box">N + 's + N  |  Ns' + N (số nhiều)</div>
  <div class="example-box"><strong>Ví dụ:</strong> Tom's book | the students' books</div>
</div>`
  },
  {
    num: 4, level: 'a1a2',
    title: 'To Be & Động từ thường — Hiện tại',
    content: `
<div class="theory-block">
  <h4>To Be (am / is / are)</h4>
  <div class="table-wrap"><table>
    <tr><th>Chủ ngữ</th><th>Khẳng định</th><th>Phủ định</th><th>Nghi vấn</th></tr>
    <tr><td>I</td><td>am</td><td>am not</td><td>Am I...?</td></tr>
    <tr><td>He/She/It</td><td>is</td><td>isn't</td><td>Is he/she/it...?</td></tr>
    <tr><td>You/We/They</td><td>are</td><td>aren't</td><td>Are you/we/they...?</td></tr>
  </table></div>
</div>
<div class="theory-block">
  <h4>Hiện tại đơn (Present Simple)</h4>
  <div class="formula-box">I/You/We/They + V(原形) | He/She/It + V(s/es)</div>
  <div class="example-box"><strong>Dấu hiệu:</strong> always, usually, often, sometimes, never, every day/week/month, on Mondays...</div>
  <div class="note-box"><strong>Chia -s/-es cho He/She/It:</strong><br>
  • Thêm -es: -s, -x, -sh, -ch, -o → watches, goes<br>
  • -y → -ies: study→studies, try→tries<br>
  • Bất quy tắc: have→has, be→is, do→does
  </div>
</div>
<div class="theory-block">

function switchPage(id, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

}

function renderTheory(filterLevel) {
  const list = document.getElementById('theory-list');
  list.innerHTML = '';
  const chapters = filterLevel === 'all' ? CHAPTERS : CHAPTERS.filter(c => c.level === filterLevel);
  chapters.forEach(ch => {
    const div = document.createElement('div');
    div.className = 'chapter-card';
    div.id = 'ch-' + ch.num;
    div.innerHTML = `
      <div class="chapter-head" onclick="toggleChapter(${ch.num})">
        <div class="ch-num">${ch.num}</div>
        <div class="ch-title">${ch.title}</div>
        <span class="ch-badge">${ch.level === 'a1a2' ? 'A1–A2' : ch.level === 'b1b2' ? 'B1–B2' : 'C1–C2'}</span>
        <span class="ch-arrow">⌄</span>
      </div>
      <div class="chapter-body">${ch.content}</div>`;
    list.appendChild(div);
  });
}

function toggleChapter(num) {
  const card = document.getElementById('ch-' + num);
  card.classList.toggle('open');
}

function filterTheory(level, btn) {
  document.querySelectorAll('#page-theory .lvl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTheory(level);
}

// ══════════════════════════════════════════════
// PRACTICE RENDER
// ══════════════════════════════════════════════
function renderExercises(level) {
  currentLevel = level;
  const list = document.getElementById('practice-list');
  list.innerHTML = '';

  const mcqs = level === 'a1a2' ? MCQ_A1A2 : level === 'b1b2' ? MCQ_B1B2 : MCQ_C1C2;
  const sents = level === 'a1a2' ? SENT_A1A2 : level === 'b1b2' ? SENT_B1B2 : SENT_C1C2;

  // MCQ section
  const mcqTitle = document.createElement('div');
  mcqTitle.className = 'ex-section-title';
  mcqTitle.textContent = '📝 Câu 1–20: Trắc nghiệm';
  list.appendChild(mcqTitle);

  mcqs.forEach(q => {
    const key = level + '_mcq_' + q.num;
    const saved = state[level][key];
    const div = document.createElement('div');
    div.className = 'mcq-card';
    div.id = 'card-' + key;

    const optsHtml = q.opts.map((opt, i) => {
      let cls = 'mcq-opt';
      let dis = '';
      if (saved !== undefined) {
        dis = 'disabled';
        if (i === q.ans) cls += ' correct';
        else if (i === saved && saved !== q.ans) cls += ' wrong';
      }
      return `<button class="${cls}" ${dis} onclick="checkMCQ('${key}',${i},${q.ans})">${String.fromCharCode(65+i)}. ${opt}</button>`;
    }).join('');

    let fbHtml = '';
    if (saved !== undefined) {
      const ok = saved === q.ans;
      fbHtml = `<div class="mcq-feedback ${ok?'correct-fb':'wrong-fb'} show">
        <div class="fb-label ${ok?'ok':'no'}">${ok?'✅ Chính xác!':'❌ Sai rồi!'}</div>
        <div>${q.explain}</div>
      </div>`;
    }

    div.innerHTML = `
      <div class="mcq-num">Câu ${q.num}</div>
      <div class="mcq-q">${q.text}</div>
      <div class="mcq-opts" id="opts-${key}">${optsHtml}</div>
      ${fbHtml}`;
    list.appendChild(div);
  });

  // Sentence section
  const sentTitle = document.createElement('div');
  sentTitle.className = 'ex-section-title';
  sentTitle.style.marginTop = '30px';
  sentTitle.textContent = '✏️ Câu 21–25: Sắp xếp câu';
  list.appendChild(sentTitle);

  sents.forEach(s => {
    const key = level + '_sent_' + s.num;
    const saved = state[level][key];
    const shuffled = saved ? saved.placed : shuffle([...s.words]);
    if (!saved) state[level][key] = { placed: [], shuffled, checked: false };

    renderSentCard(list, s, key, level);
  });

  updateProgress();
  restoreProgress(level);
}

function renderSentCard(container, s, key, level) {
  const existing = document.getElementById('sent-' + key);
  if (existing) existing.remove();

  const div = document.createElement('div');
  div.className = 'sent-card';
  div.id = 'sent-' + key;

  const st = state[level][key] || { placed:[], shuffled: shuffle([...s.words]), checked:false };
  const placedHtml = st.placed.length
    ? st.placed.map((w,i) => `<span class="placed-word" onclick="removeWord('${key}',${i},this)">${w}</span>`).join('')
    : '<span class="zone-hint">Nhấn vào từ bên dưới để đặt vào đây...</span>';

  const bankHtml = st.shuffled.map((w,i) => {
    const used = st.placed.includes(w) ? 'used' : '';
    // mark first occurrence
    const usedCount = st.placed.filter(p => p===w).length;
    const allCount = st.shuffled.filter(c=>c===w).length;
    const cls = usedCount > 0 ? 'word-chip used' : 'word-chip';
    return `<button class="word-chip" onclick="placeWord('${key}',${i},this)">${w}</button>`;
  }).join('');

  const fbHtml = st.checked
    ? `<div class="sent-feedback ${st.correct?'ok':'no'} show">
        <strong>${st.correct?'✅ Đúng!':'❌ Chưa đúng!'}</strong><br>
        ${st.correct ? '' : `Đáp án: <em>${s.answerDisplay}</em><br>`}
        ${s.explain}
      </div>`
    : `<div class="sent-feedback" id="sfb-${key}"></div>`;

  div.innerHTML = `
    <div class="sent-num">Câu ${s.num}</div>
    <div class="sent-q">${s.instruction}</div>
    <div class="drop-zone" id="dz-${key}">${placedHtml}</div>
    <div class="word-bank" id="wb-${key}">${bankHtml}</div>
    <div class="sent-actions">
      <button class="btn-check" onclick="checkSentence('${key}','${level}')">Kiểm tra</button>
      <button class="btn-reset" onclick="resetSentence('${key}','${level}')">Làm lại</button>
    </div>
    ${fbHtml}`;
  container.appendChild(div);
  syncWordBank(key, level);
}

function shuffle(arr) {
  for (let i = arr.length-1; i > 0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

// ══════════════════════════════════════════════
// MCQ CHECK
// ══════════════════════════════════════════════
function checkMCQ(key, chosen, correct, cardKey) {
  const level = key.startsWith('a1a2') ? 'a1a2' : 'b1b2';
  state[level][key] = chosen;
  saveProgress();

  const opts = document.querySelectorAll(`#opts-${key} .mcq-opt`);
  opts.forEach((btn, i) => {
    btn.disabled = true;
    if (i === correct) btn.classList.add('correct');
    else if (i === chosen && chosen !== correct) btn.classList.add('wrong');
  });

  const mcqs = level === 'a1a2' ? MCQ_A1A2 : level === 'b1b2' ? MCQ_B1B2 : MCQ_C1C2;
  const q = mcqs.find(q => (level+'_mcq_'+q.num) === key);
  const ok = chosen === correct;

  const fb = document.createElement('div');
  fb.className = `mcq-feedback ${ok?'correct-fb':'wrong-fb'} show`;
  fb.innerHTML = `<div class="fb-label ${ok?'ok':'no'}">${ok?'✅ Chính xác!':'❌ Sai rồi!'}</div><div>${q.explain}</div>`;
  document.getElementById('card-' + key).appendChild(fb);

  updateProgress();
}

// ══════════════════════════════════════════════
// SENTENCE CHECK
// ══════════════════════════════════════════════
function placeWord(key, idx, el) {
  if (el.classList.contains('used')) return;
  const level = key.startsWith('a1a2') ? 'a1a2' : 'b1b2';
  const st = state[level][key];
  const word = el.textContent;
  st.placed.push(word);
  el.classList.add('used');
  updateDropZone(key, level);
  saveProgress();
}

function removeWord(key, idx, el) {
  const level = key.startsWith('a1a2') ? 'a1a2' : 'b1b2';
  const st = state[level][key];
  st.placed.splice(idx, 1);
  updateDropZone(key, level);
  syncWordBank(key, level);
  saveProgress();
}

function updateDropZone(key, level) {
  const dz = document.getElementById('dz-' + key);
  const st = state[level][key];
  if (st.placed.length === 0) {
    dz.innerHTML = '<span class="zone-hint">Nhấn vào từ bên dưới để đặt vào đây...</span>';
  } else {
    dz.innerHTML = st.placed.map((w,i) =>
      `<span class="placed-word" onclick="removeWord('${key}',${i},this)">${w}</span>`
    ).join('');
  }
}

function syncWordBank(key, level) {
  const wb = document.getElementById('wb-' + key);
  if (!wb) return;
  const st = state[level][key];
  const chips = wb.querySelectorAll('.word-chip');
  // Reset all
  chips.forEach(c => c.classList.remove('used'));
  // Mark used
  const placedCopy = [...st.placed];
  chips.forEach(c => {
    const w = c.textContent;
    const idx = placedCopy.indexOf(w);
    if (idx !== -1) {
      c.classList.add('used');
      placedCopy.splice(idx, 1);
    }
  });
}

function checkSentence(key, level) {
  const st = state[level][key];
  const sents = level === 'a1a2' ? SENT_A1A2 : level === 'b1b2' ? SENT_B1B2 : SENT_C1C2;
  const s = sents.find(s => (level+'_sent_'+s.num) === key);
  const given = st.placed.join(' ').toLowerCase().replace(/[.!?]/g,'').trim();
  const expected = s.answer.toLowerCase().replace(/[.!?]/g,'').trim();
  const ok = given === expected;
  st.checked = true;
  st.correct = ok;
  saveProgress();

  const fbEl = document.getElementById('sfb-' + key) || document.querySelector(`#sent-${key} .sent-feedback`);
  if (fbEl) {
    fbEl.className = `sent-feedback ${ok?'ok':'no'} show`;
    fbEl.innerHTML = `<strong>${ok?'✅ Đúng!':'❌ Chưa đúng!'}</strong><br>
      ${ok ? '' : `Đáp án: <em>${s.answerDisplay}</em><br>`}
      ${s.explain}`;
  }
  updateProgress();
}

function resetSentence(key, level) {
  const st = state[level][key];
  st.placed = [];
  st.checked = false;
  st.correct = false;
  st.shuffled = shuffle([...st.shuffled]);
  saveProgress();

  const sents = level === 'a1a2' ? SENT_A1A2 : level === 'b1b2' ? SENT_B1B2 : SENT_C1C2;
  const s = sents.find(s => (level+'_sent_'+s.num) === key);
  updateDropZone(key, level);
  syncWordBank(key, level);

  const fbEl = document.querySelector(`#sent-${key} .sent-feedback`);
  if (fbEl) { fbEl.className = 'sent-feedback'; fbEl.innerHTML = ''; }
  updateProgress();
}

// ══════════════════════════════════════════════
// PROGRESS
// ══════════════════════════════════════════════
function updateProgress() {
  const level = currentLevel;
  let done = 0;
  const total = 25;

  // MCQ
  for (let i=1; i<=20; i++) {
    if (state[level][level+'_mcq_'+i] !== undefined) done++;
  }
  // Sent
  const sentStart = level === 'c1c2' ? 26 : 21;
  const sentEnd = level === 'c1c2' ? 30 : 25;
  for (let i=sentStart; i<=sentEnd; i++) {
    const st = state[level][level+'_sent_'+i];
    if (st && st.checked) done++;
  }

  document.getElementById('prog-label').textContent = `${done} / ${total} câu hoàn thành`;
  const pct = Math.round(done/total*100);
  document.getElementById('prog-pct').textContent = pct + '%';
  document.getElementById('prog-fill').style.width = pct + '%';
}

function filterExercises(level, btn) {
  document.querySelectorAll('#page-practice .lvl-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderExercises(level);
}

function resetAll() {
  const level = currentLevel;
  // Clear MCQ
  for (let i=1; i<=20; i++) delete state[level][level+'_mcq_'+i];
  // Clear sent
  const sents = level === 'a1a2' ? SENT_A1A2 : level === 'b1b2' ? SENT_B1B2 : SENT_C1C2;
  sents.forEach(s => {
    const key = level+'_sent_'+s.num;
    state[level][key] = { placed:[], shuffled: shuffle([...s.words]), checked:false };
  });
  saveProgress();
  renderExercises(level);
}

// ══════════════════════════════════════════════
// PERSISTENCE
// ══════════════════════════════════════════════
function saveProgress() {
  try {
    localStorage.setItem('grammar_progress', JSON.stringify(state));
  } catch(e) {}
}

function restoreProgress(level) {
  try {
    const saved = JSON.parse(localStorage.getItem('grammar_progress') || '{}');
    if (saved.a1a2) Object.assign(state.a1a2, saved.a1a2);
    if (saved.b1b2) Object.assign(state.b1b2, saved.b1b2);
    if (saved.c1c2) Object.assign(state.c1c2, saved.c1c2);
  } catch(e) {}
  updateProgress();
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
(function init() {
  try {
    const saved = JSON.parse(localStorage.getItem('grammar_progress') || '{}');
    if (saved.a1a2) Object.assign(state.a1a2, saved.a1a2);
    if (saved.b1b2) Object.assign(state.b1b2, saved.b1b2);
    if (saved.c1c2) Object.assign(state.c1c2, saved.c1c2);
  } catch(e) {}
  renderTheory('all');
  renderExercises('a1a2');
})();
</script>
