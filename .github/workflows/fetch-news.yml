name: Fetch Daily News

on:
  schedule:
    # 00:00 UTC = 07:00 Giờ Việt Nam (UTC+7)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run news fetcher
        env:
          FINNHUB_KEY:  ${{ secrets.FINNHUB_KEY }}
          GNEWS_KEY:    ${{ secrets.GNEWS_KEY }}
          NEWSDATA_KEY: ${{ secrets.NEWSDATA_KEY }}
        run: python scripts/fetch_news.py

      - name: Commit updated news.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --staged --quiet || \
            git commit -m "chore: update news data $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
