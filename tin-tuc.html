<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tin Tức</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Inter:wght@400;500;600&display=swap">
<style>
/* ── Tokens ─────────────────────────────────────────────────────── */
:root {
  --bg:        #eef0f4;
  --surface:   #ffffff;
  --surface2:  #f5f6f9;
  --border:    #dde1ea;
  --text-h:    #111c30;
  --text-b:    #374151;
  --text-meta: #6b7898;
  --accent:    #1d5fa8;
  --accent-hi: #1d5fa81a;
  --red:       #d63b2f;
  --green:     #1a7f5a;
  --tag-finance: #1d5fa8;
  --tag-stock:   #0e7490;
  --tag-tech:    #6d28d9;
  --tag-biz:     #b45309;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0d1117;
    --surface:   #161b25;
    --surface2:  #1e2535;
    --border:    #2a3245;
    --text-h:    #e8edf6;
    --text-b:    #a8b4cc;
    --text-meta: #5e6e8e;
    --accent:    #4d8dd4;
    --accent-hi: #4d8dd41a;
    --red:       #e25e50;
    --green:     #2da870;
    --tag-finance: #4d8dd4;
    --tag-stock:   #22b8cc;
    --tag-tech:    #a78bfa;
    --tag-biz:     #fbbf24;
  }
}
:root[data-theme="dark"] {
  --bg:        #0d1117;
  --surface:   #161b25;
  --surface2:  #1e2535;
  --border:    #2a3245;
  --text-h:    #e8edf6;
  --text-b:    #a8b4cc;
  --text-meta: #5e6e8e;
  --accent:    #4d8dd4;
  --accent-hi: #4d8dd41a;
  --red:       #e25e50;
  --green:     #2da870;
  --tag-finance: #4d8dd4;
  --tag-stock:   #22b8cc;
  --tag-tech:    #a78bfa;
  --tag-biz:     #fbbf24;
}

/* ── Reset & base ────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 15px; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text-b);
  font-family: 'Inter', system-ui, sans-serif;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

/* ── Site header ─────────────────────────────────────────────────── */
.site-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 24px;
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 100;
}
.nav-back {
  font-size: 0.82rem;
  color: var(--accent);
  text-decoration: none;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}
.nav-back::before { content: '←'; }
.page-heading {
  font-family: 'Merriweather', Georgia, serif;
  font-weight: 900;
  font-size: 1.1rem;
  color: var(--text-h);
  margin: 0;
  letter-spacing: -0.02em;
}
.header-right {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 10px;
}
.update-badge {
  font-size: 0.72rem;
  color: var(--text-meta);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 3px 10px;
  white-space: nowrap;
}
.update-badge b { color: var(--green); }
.theme-btn {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 5px 10px;
  font-size: 0.8rem;
  cursor: pointer;
  color: var(--text-b);
}
.theme-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── Category bar ────────────────────────────────────────────────── */
.cat-bar {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding-inline: 24px;
  overflow-x: auto;
  scrollbar-width: none;
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-pills {
  display: flex;
  gap: 0;
  min-width: max-content;
}
.cat-pill {
  padding: 10px 16px;
  font-size: 0.83rem;
  font-weight: 500;
  color: var(--text-meta);
  cursor: pointer;
  border: none;
  background: none;
  border-bottom: 2px solid transparent;
  white-space: nowrap;
  transition: color .15s, border-color .15s;
}
.cat-pill:hover { color: var(--text-h); }
.cat-pill.active { color: var(--accent); border-bottom-color: var(--accent); }
.cat-pill:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }

/* ── Main wrapper ────────────────────────────────────────────────── */
.main {
  width: 100%;
  padding-inline: 24px;
  padding-block: 28px;
}

/* ── Section heading ─────────────────────────────────────────────── */
.sec-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.sec-title {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 0.95rem;
  font-weight: 700;
  color: var(--text-h);
  margin: 0;
  padding-left: 11px;
  border-left: 3px solid var(--accent);
}

/* ── Featured block ──────────────────────────────────────────────── */
.featured {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 28px;
}
@media (max-width: 680px) { .featured { grid-template-columns: 1fr; } }

.feat-main {
  background: var(--surface);
  padding: 26px 26px 22px;
  cursor: pointer;
  display: block;
}
.feat-main:hover .feat-h { color: var(--accent); }
.feat-side {
  background: var(--surface);
  display: flex;
  flex-direction: column;
  gap: 1px;
}
.feat-sub {
  background: var(--surface2);
  padding: 18px 20px;
  flex: 1;
  cursor: pointer;
  display: block;
}
.feat-sub:hover .sub-h { color: var(--accent); }

/* ── Shared article parts ────────────────────────────────────────── */
.meta-row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 10px;
}
.tag {
  display: inline-block;
  font-size: 0.68rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 2px 7px;
  border-radius: 4px;
  color: #fff;
  flex-shrink: 0;
}
.tag-finance  { background: var(--tag-finance); }
.tag-stock    { background: var(--tag-stock); }
.tag-tech     { background: var(--tag-tech); }
.tag-biz      { background: var(--tag-biz); color: #fff; }

.sentiment {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  font-size: 0.68rem;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 20px;
}
.sentiment.pos { background: #dcfce7; color: #166534; }
.sentiment.neg { background: #fee2e2; color: #991b1b; }
.sentiment.neu { background: var(--surface2); color: var(--text-meta); border: 1px solid var(--border); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) .sentiment.pos { background: #14532d55; color: #4ade80; }
  :root:not([data-theme="light"]) .sentiment.neg { background: #7f1d1d55; color: #f87171; }
}
:root[data-theme="dark"] .sentiment.pos { background: #14532d55; color: #4ade80; }
:root[data-theme="dark"] .sentiment.neg { background: #7f1d1d55; color: #f87171; }

.article-meta { font-size: 0.72rem; color: var(--text-meta); }

.feat-h {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 1.4rem;
  font-weight: 700;
  line-height: 1.35;
  color: var(--text-h);
  margin: 0 0 10px;
  text-wrap: balance;
  transition: color .15s;
}
.feat-desc {
  font-size: 0.875rem;
  color: var(--text-b);
  line-height: 1.65;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.sub-h {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 0.9rem;
  font-weight: 700;
  color: var(--text-h);
  line-height: 1.4;
  margin: 0 0 6px;
  text-wrap: balance;
  transition: color .15s;
}

/* ── News grid ───────────────────────────────────────────────────── */
.news-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--border);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 28px;
}
@media (max-width: 800px) { .news-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .news-grid { grid-template-columns: 1fr; } }

.news-card {
  background: var(--surface);
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  cursor: pointer;
  transition: background .15s;
}
.news-card:hover { background: var(--accent-hi); }
.news-card:hover .card-h { color: var(--accent); }
.card-h {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 0.92rem;
  font-weight: 700;
  line-height: 1.45;
  color: var(--text-h);
  margin: 0;
  text-wrap: balance;
  transition: color .15s;
  flex: 1;
}
.card-desc {
  font-size: 0.8rem;
  color: var(--text-b);
  line-height: 1.6;
  margin: 0;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-footer {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-top: auto;
  flex-wrap: wrap;
}
.card-source { font-size: 0.7rem; color: var(--text-meta); font-weight: 500; }
.card-dot { width: 3px; height: 3px; background: var(--border); border-radius: 50%; flex-shrink: 0; }
.card-time  { font-size: 0.7rem; color: var(--text-meta); }

/* ── Trending list ───────────────────────────────────────────────── */
.news-list {
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 32px;
}
.news-row {
  background: var(--surface);
  display: flex;
  align-items: flex-start;
  gap: 14px;
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background .15s;
}
.news-row:last-child { border-bottom: none; }
.news-row:hover { background: var(--surface2); }
.news-row:hover .row-h { color: var(--accent); }
.row-num {
  font-size: 1.4rem;
  font-weight: 900;
  color: var(--border);
  font-family: 'Merriweather', serif;
  line-height: 1.1;
  min-width: 26px;
  padding-top: 2px;
  font-variant-numeric: tabular-nums;
}
.row-body { flex: 1; min-width: 0; }
.row-h {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 0.88rem;
  font-weight: 700;
  color: var(--text-h);
  margin: 0 0 5px;
  line-height: 1.4;
  text-wrap: balance;
  transition: color .15s;
}
.row-meta {
  font-size: 0.7rem;
  color: var(--text-meta);
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

/* ── Empty & loading states ──────────────────────────────────────── */
.state-box {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  text-align: center;
  padding: 56px 16px;
  color: var(--text-meta);
  font-size: 0.875rem;
  margin-bottom: 28px;
}
.state-box .spinner {
  display: inline-block;
  width: 28px; height: 28px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  margin-bottom: 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }

/* ── Load-more button ────────────────────────────────────────────── */
.load-more-wrap { text-align: center; margin-bottom: 32px; }
.load-more-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 9px 24px;
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
  transition: background .15s;
}
.load-more-btn:hover { background: var(--accent-hi); }
.load-more-btn[hidden] { display: none; }

/* ════════════════════════════════════════════════════════════════════
   READER VIEW
   ════════════════════════════════════════════════════════════════════ */
.reader-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg);
  z-index: 200;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
}
.reader-overlay.open { transform: translateX(0); }

/* reader header bar */
.reader-header {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 24px;
  flex-shrink: 0;
  padding-top: max(13px, calc(13px + env(safe-area-inset-top, 0px)));
}
.reader-back {
  background: none;
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 14px;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  flex-shrink: 0;
  white-space: nowrap;
}
.reader-back:hover { background: var(--accent-hi); }
.reader-back::before { content: '←'; }
.reader-title-bar {
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-meta);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  flex: 1;
  min-width: 0;
}
.reader-src-link {
  font-size: 0.78rem;
  color: var(--accent);
  text-decoration: none;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  white-space: nowrap;
  flex-shrink: 0;
}
.reader-src-link:hover { background: var(--accent-hi); }

/* reader scrollable body */
.reader-body {
  flex: 1;
  overflow-y: auto;
  padding: 40px 24px 60px;
  scroll-behavior: smooth;
}
.reader-inner {
  max-width: 720px;
  margin-inline: auto;
}

/* article header */
.reader-cat-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
  flex-wrap: wrap;
}
.reader-heading {
  font-family: 'Merriweather', Georgia, serif;
  font-size: clamp(1.4rem, 4vw, 2.1rem);
  font-weight: 900;
  line-height: 1.25;
  color: var(--text-h);
  margin: 0 0 18px;
  text-wrap: balance;
}
.reader-meta {
  font-size: 0.78rem;
  color: var(--text-meta);
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}
.reader-meta strong { color: var(--text-b); }
.reader-divider {
  border: none;
  border-top: 1px solid var(--border);
  margin-bottom: 28px;
}
.reader-image {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: 10px;
  margin-bottom: 28px;
  display: block;
}

/* article body text */
.reader-content {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 1.05rem;
  line-height: 1.85;
  color: var(--text-b);
}
.reader-content p {
  margin: 0 0 1.4em;
}

/* fallback summary box */
.reader-summary {
  background: var(--surface2);
  border-left: 3px solid var(--accent);
  border-radius: 0 8px 8px 0;
  padding: 18px 20px;
  font-size: 0.92rem;
  line-height: 1.7;
  color: var(--text-b);
  margin-bottom: 28px;
  font-style: italic;
}
.reader-no-content {
  font-size: 0.82rem;
  color: var(--text-meta);
  margin-top: 8px;
}

/* original link row */
.reader-orig-row {
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--border);
}

/* original link button */
.reader-orig-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
  padding: 10px 20px;
  background: var(--accent);
  color: #fff;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 600;
  text-decoration: none;
  transition: opacity .15s;
}
.reader-orig-btn:hover { opacity: .85; }

/* ════════════════════════════════════════════════════════════════════
   DICTIONARY POPUP
   ════════════════════════════════════════════════════════════════════ */
#dict-popup {
  position: fixed;
  z-index: 400;
  width: 300px;
  max-width: calc(100vw - 32px);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  box-shadow: 0 8px 32px rgba(0,0,0,.22), 0 2px 8px rgba(0,0,0,.12);
  overflow: hidden;
  opacity: 0;
  transform: translateY(6px) scale(.97);
  transition: opacity .18s, transform .18s;
  pointer-events: none;
}
#dict-popup.visible {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

.dict-header {
  background: var(--accent);
  padding: 12px 16px 10px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  justify-content: space-between;
}
.dict-word {
  font-family: 'Merriweather', Georgia, serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  word-break: break-word;
}
.dict-phonetic {
  font-size: 0.78rem;
  color: rgba(255,255,255,.75);
  margin-top: 3px;
  font-family: 'Inter', sans-serif;
}
.dict-close {
  background: rgba(255,255,255,.18);
  border: none;
  border-radius: 6px;
  width: 24px; height: 24px;
  cursor: pointer;
  color: #fff;
  font-size: 1rem;
  line-height: 1;
  flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.dict-close:hover { background: rgba(255,255,255,.3); }

.dict-body {
  padding: 14px 16px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  max-height: 280px;
  overflow-y: auto;
}

/* translation row */
.dict-vi {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-h);
  line-height: 1.35;
}
.dict-vi-label {
  font-size: 0.65rem;
  font-weight: 600;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--text-meta);
  margin-bottom: 2px;
}

/* meaning rows */
.dict-meaning {
  border-top: 1px solid var(--border);
  padding-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.dict-pos {
  display: inline-block;
  font-size: 0.67rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  padding: 1px 7px;
  border-radius: 4px;
  background: var(--accent-hi);
  color: var(--accent);
  margin-bottom: 2px;
  width: fit-content;
}
.dict-def {
  font-size: 0.82rem;
  color: var(--text-b);
  line-height: 1.5;
}
.dict-example {
  font-size: 0.78rem;
  color: var(--text-meta);
  font-style: italic;
  line-height: 1.45;
  padding-left: 10px;
  border-left: 2px solid var(--border);
}
.dict-example::before { content: '"'; }
.dict-example::after  { content: '"'; }

/* loading / error */
.dict-loading {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.82rem;
  color: var(--text-meta);
  padding: 4px 0;
}
.dict-loading .spinner {
  width: 16px; height: 16px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .6s linear infinite;
  flex-shrink: 0;
}
.dict-error {
  font-size: 0.82rem;
  color: var(--text-meta);
  font-style: italic;
}

/* hint bar at bottom of reader */
.dict-hint {
  position: sticky;
  bottom: 0;
  background: linear-gradient(transparent, var(--bg) 40%);
  padding: 20px 0 8px;
  text-align: center;
  font-size: 0.72rem;
  color: var(--text-meta);
  pointer-events: none;
  margin-top: 24px;
}
</style>
</head>
<body>

<!-- ── List view ── -->
<header class="site-header" id="list-header">
  <a class="nav-back" href="Home.html">Trang chủ</a>
  <h1 class="page-heading">Tin Tức</h1>
  <div class="header-right">
    <span class="update-badge" id="update-label">Đang tải...</span>
    <button class="theme-btn" id="theme-btn" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<nav class="cat-bar" id="cat-bar" aria-label="Chủ đề">
  <div class="cat-pills">
    <button class="cat-pill active" onclick="setFilter('all',this)">Tất cả</button>
    <button class="cat-pill" onclick="setFilter('finance',this)">💰 Tài chính</button>
    <button class="cat-pill" onclick="setFilter('stock',this)">📈 Chứng khoán</button>
    <button class="cat-pill" onclick="setFilter('tech',this)">💻 Công nghệ</button>
    <button class="cat-pill" onclick="setFilter('biz',this)">🏢 Doanh nghiệp</button>
  </div>
</nav>

<main class="main" id="main">
  <div class="state-box" id="loading-box">
    <div class="spinner"></div><br>Đang tải tin tức mới nhất…
  </div>
</main>

<!-- ════════════════════════════════════════════════════════════════════
     READER OVERLAY
     ════════════════════════════════════════════════════════════════════ -->
<div class="reader-overlay" id="reader" role="dialog" aria-modal="true" aria-label="Article reader" hidden>
  <div class="reader-header">
    <button class="reader-back" onclick="closeReader()">Quay lại</button>
    <span class="reader-title-bar" id="reader-title-bar">—</span>
    <a class="reader-src-link" id="reader-src-link" href="#" target="_blank" rel="noopener">
      Trang gốc ↗
    </a>
  </div>
  <div class="reader-body" id="reader-body">
    <div class="reader-inner" id="reader-inner"></div>
    <div class="dict-hint">💡 Bôi đen bất kỳ từ hoặc cụm từ để tra từ điển</div>
  </div>
</div>

<!-- Dictionary popup -->
<div id="dict-popup" role="tooltip" aria-live="polite">
  <div class="dict-header">
    <div>
      <div class="dict-word" id="dict-word"></div>
      <div class="dict-phonetic" id="dict-phonetic"></div>
    </div>
    <button class="dict-close" onclick="closeDict()" aria-label="Đóng">✕</button>
  </div>
  <div class="dict-body" id="dict-body">
    <div class="dict-loading"><div class="spinner"></div> Đang tra...</div>
  </div>
</div>

<script>
// ─────────────────────────────────────────────────────────────────────────────
// Config
// ─────────────────────────────────────────────────────────────────────────────
const DATA_URL  = 'data/news.json';
const PAGE_SIZE = 9;

// ─────────────────────────────────────────────────────────────────────────────
// State
// ─────────────────────────────────────────────────────────────────────────────
let allArticles = [];
let filtered    = [];
let currentCat  = 'all';
let shown       = 0;

// ─────────────────────────────────────────────────────────────────────────────
// Theme
// ─────────────────────────────────────────────────────────────────────────────
function toggleTheme() {
  const cur  = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('theme-btn').textContent = next === 'dark' ? '☀️' : '🌙';
  try { localStorage.setItem('news_theme', next); } catch(e) {}
}
(function applyTheme() {
  try {
    const saved = localStorage.getItem('news_theme');
    if (saved) {
      document.documentElement.setAttribute('data-theme', saved);
      if (saved === 'dark') document.getElementById('theme-btn').textContent = '☀️';
    }
  } catch(e) {}
})();

// ─────────────────────────────────────────────────────────────────────────────
// Helpers
// ─────────────────────────────────────────────────────────────────────────────
const TAG_LABELS = { finance: 'Finance', stock: 'Markets', tech: 'Technology', biz: 'Business' };

function tagHTML(cat, small) {
  const sz  = small ? 'font-size:.65rem;padding:1px 6px' : '';
  return `<span class="tag tag-${cat}" style="${sz}">${TAG_LABELS[cat] || cat}</span>`;
}

function sentHTML(s) {
  if (!s) return '';
  const map = { pos: ['pos','▲ Positive'], neg: ['neg','▼ Negative'], neu: ['neu','● Neutral'] };
  const [cls, lbl] = map[s] || ['neu','● Neutral'];
  return `<span class="sentiment ${cls}">${lbl}</span>`;
}

function relTime(iso) {
  if (!iso) return '';
  const diff = (Date.now() - new Date(iso)) / 1000;
  if (diff < 3600)  return `${Math.max(1, Math.floor(diff/60))} min ago`;
  if (diff < 86400) return `${Math.floor(diff/3600)} hr ago`;
  return `${Math.floor(diff/86400)}d ago`;
}

function esc(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Strip HTML tags từ text (phòng trường hợp API trả về HTML trong desc)
function stripHtml(s) {
  const d = document.createElement('div');
  d.innerHTML = s || '';
  return d.textContent || d.innerText || '';
}

// ─────────────────────────────────────────────────────────────────────────────
// Reader view — content fetched on-demand via Jina Reader (bypasses CORS)
// ─────────────────────────────────────────────────────────────────────────────

function extractJinaBody(text) {
  const marker = 'Markdown Content:';
  const idx = text.indexOf(marker);
  const body = idx > -1 ? text.slice(idx + marker.length) : text;
  // Jina prepends page nav before article — skip to first # heading (actual content)
  const headingIdx = body.search(/\n#{1,3} \S/);
  return (headingIdx > -1 ? body.slice(headingIdx) : body).trim();
}

function mdToHtml(md) {
  return md
    .split(/\n{2,}/)
    .map(b => b.trim())
    .filter(b => {
      // Strip all markdown/links to get plain text, then check length
      const plain = b
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
        .replace(/[*_`~#>\-]/g, '')
        .trim();
      return plain.length > 20;
    })
    .slice(0, 60)
    .map(b => {
      const isHeading = /^#{1,4}\s/.test(b);
      const plain = b
        .replace(/^#+\s*/, '')
        .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
        .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
        .replace(/\*\*([^*]+)\*\*/g, '$1')
        .replace(/\*([^*]+)\*/g, '$1')
        .replace(/`([^`]+)`/g, '$1')
        .replace(/~~([^~]+)~~/g, '$1')
        .replace(/^[>\-\*\+]\s+/gm, '')
        .trim();
      if (!plain) return '';
      return isHeading
        ? `<p><strong>${esc(plain)}</strong></p>`
        : `<p>${esc(plain)}</p>`;
    })
    .filter(Boolean)
    .join('\n');
}

function origLink(article) {
  return `<div class="reader-orig-row">
    <a class="reader-orig-btn" href="${esc(article.url)}" target="_blank" rel="noopener">
      Read full article on ${esc(article.source)} ↗
    </a>
  </div>`;
}

async function buildBodyHTML(article) {
  // 1. Use cached content from news.json if available
  const cached = (article.content || '').trim();
  if (cached.length > 80) {
    const paras = cached
      .split(/\n{2,}|(?<=[.!?])\s{2,}(?=[A-Z])/)
      .map(p => p.trim()).filter(p => p.length > 20);
    let finalParas = paras;
    if (paras.length === 1 && paras[0].split(' ').length > 60) {
      const words = paras[0].split(' ');
      finalParas = [];
      for (let i = 0; i < words.length; i += 100)
        finalParas.push(words.slice(i, i + 100).join(' '));
    }
    return `<div class="reader-content">${finalParas.map(p => `<p>${esc(p)}</p>`).join('')}</div>`
      + origLink(article);
  }

  // 2. Fetch on-demand via Jina Reader (client-side, handles CORS automatically)
  try {
    const res = await fetch(`https://r.jina.ai/${article.url}`, {
      headers: {
        'Accept': 'text/plain',
        'X-Retain-Images': 'none',   // cleaner text-only output
        'X-No-Cache': 'true',
      },
      signal: AbortSignal.timeout(15000),
    });
    if (res.ok) {
      const text = await res.text();
      const md   = extractJinaBody(text);
      const html = mdToHtml(md);
      if (html.length > 100)
        return `<div class="reader-content">${html}</div>` + origLink(article);
    }
  } catch (_) { /* fall through */ }

  // 3. Fallback: desc summary + link
  const desc = stripHtml(article.desc || '');
  if (desc.length > 20) {
    return `<div class="reader-summary">${esc(desc)}</div>
      <p class="reader-no-content">Nội dung đầy đủ có trên trang gốc.</p>
      ${origLink(article)}`;
  }
  return `<p class="reader-no-content">Không có nội dung.</p>${origLink(article)}`;
}

let _readerGen = 0; // incremented on each open; stale fetches compare and bail

async function openReader(article) {
  const gen = ++_readerGen;
  const overlay  = document.getElementById('reader');
  const inner    = document.getElementById('reader-inner');
  const titleBar = document.getElementById('reader-title-bar');
  const srcLink  = document.getElementById('reader-src-link');

  titleBar.textContent = article.source || '';
  srcLink.href = article.url || '#';

  const imgHTML = article.image
    ? `<img class="reader-image" src="${esc(article.image)}" alt="" loading="lazy" onerror="this.remove()">`
    : '';

  // Render header immediately with loading placeholder for body
  inner.innerHTML = `
    <div class="reader-cat-row">
      ${tagHTML(article.cat)}
      ${sentHTML(article.sentiment)}
    </div>
    <h1 class="reader-heading">${esc(article.title)}</h1>
    <div class="reader-meta">
      <strong>${esc(article.source)}</strong>
      <span>${relTime(article.time)}</span>
    </div>
    <hr class="reader-divider">
    ${imgHTML}
    <div id="reader-content-slot">
      <div class="state-box" style="margin-bottom:0">
        <div class="spinner"></div><br>Đang tải nội dung bài báo…
      </div>
    </div>`;

  document.getElementById('reader-body').scrollTop = 0;
  overlay.hidden = false;
  void overlay.offsetWidth;
  overlay.classList.add('open');
  history.pushState({ reader: true, url: article.url }, '', '');
  overlay.focus();

  // Async: fetch content and swap in — bail if a newer article was opened
  const bodyHTML = await buildBodyHTML(article);
  if (_readerGen !== gen) return;
  const slot = document.getElementById('reader-content-slot');
  if (slot) slot.outerHTML = bodyHTML;
}

function closeReader() {
  const overlay = document.getElementById('reader');
  overlay.classList.remove('open');
  overlay.addEventListener('transitionend', () => {
    overlay.hidden = true;
  }, { once: true });
}

// Handle browser back button closing reader
window.addEventListener('popstate', (e) => {
  const overlay = document.getElementById('reader');
  if (!overlay.hidden) closeReader();
});

// (Escape handling moved to dictionary section below)

// ─────────────────────────────────────────────────────────────────────────────
// Render helpers
// ─────────────────────────────────────────────────────────────────────────────
function renderFeatured(articles) {
  const main = articles[0];
  const subs = articles.slice(1, 4);
  return `
    <div class="sec-head"><h2 class="sec-title">Featured Today</h2></div>
    <div class="featured">
      <div class="feat-main" onclick="openReader(ARTICLES[${allArticles.indexOf(main)}])">
        <div class="meta-row">
          ${tagHTML(main.cat)}
          ${sentHTML(main.sentiment)}
          <span class="article-meta">${esc(main.source)} · ${relTime(main.time)}</span>
        </div>
        <h2 class="feat-h">${esc(main.title)}</h2>
        <p class="feat-desc">${esc(stripHtml(main.desc))}</p>
      </div>
      <div class="feat-side">
        ${subs.map(a => `
          <div class="feat-sub" onclick="openReader(ARTICLES[${allArticles.indexOf(a)}])">
            <div class="meta-row">
              ${tagHTML(a.cat)}
              ${sentHTML(a.sentiment)}
            </div>
            <h3 class="sub-h">${esc(a.title)}</h3>
            <div class="article-meta">${esc(a.source)} · ${relTime(a.time)}</div>
          </div>`).join('')}
      </div>
    </div>`;
}

function renderCard(a) {
  const idx = allArticles.indexOf(a);
  return `
    <div class="news-card" onclick="openReader(ARTICLES[${idx}])">
      <div class="meta-row">
        ${tagHTML(a.cat)}
        ${sentHTML(a.sentiment)}
      </div>
      <h3 class="card-h">${esc(a.title)}</h3>
      <p class="card-desc">${esc(stripHtml(a.desc))}</p>
      <div class="card-footer">
        <span class="card-source">${esc(a.source)}</span>
        <span class="card-dot"></span>
        <span class="card-time">${relTime(a.time)}</span>
      </div>
    </div>`;
}

function renderGrid(articles) {
  if (!articles.length) return '';
  return `
    <div class="sec-head"><h2 class="sec-title">Latest News</h2></div>
    <div class="news-grid" id="news-grid">
      ${articles.map(renderCard).join('')}
    </div>`;
}

function renderTrending(articles) {
  if (!articles.length) return '';
  return `
    <div class="sec-head"><h2 class="sec-title">Trending</h2></div>
    <div class="news-list" id="trending">
      ${articles.map((a, i) => {
        const idx = allArticles.indexOf(a);
        return `
          <div class="news-row" onclick="openReader(ARTICLES[${idx}])">
            <div class="row-num">${String(i+1).padStart(2,'0')}</div>
            <div class="row-body">
              <p class="row-h">${esc(a.title)}</p>
              <div class="row-meta">
                ${tagHTML(a.cat, true)}
                ${esc(a.source)} · ${relTime(a.time)}
              </div>
            </div>
          </div>`;
      }).join('')}
    </div>`;
}

// ─────────────────────────────────────────────────────────────────────────────
// Main render
// ─────────────────────────────────────────────────────────────────────────────
// ARTICLES is a global alias so inline onclick handlers can reach it
let ARTICLES = [];

function render() {
  ARTICLES = allArticles; // keep alias in sync
  const main = document.getElementById('main');
  if (!filtered.length) {
    main.innerHTML = '<div class="state-box">No articles found in this category.</div>';
    return;
  }

  const featured   = filtered.slice(0, 4);
  const gridItems  = filtered.slice(4, shown);
  const trendItems = filtered.slice(0, 5);
  const hasMore    = shown < filtered.length;

  main.innerHTML = `
    ${renderFeatured(featured)}
    ${renderGrid(gridItems)}
    <div class="load-more-wrap">
      <button class="load-more-btn" id="load-more-btn" ${!hasMore ? 'hidden' : ''}
        onclick="loadMore()">
        Xem thêm tin tức
      </button>
    </div>
    ${renderTrending(trendItems)}`;
}

function loadMore() {
  shown = Math.min(shown + PAGE_SIZE, filtered.length);
  render();
  document.getElementById('news-grid')?.lastElementChild?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ─────────────────────────────────────────────────────────────────────────────
// Filter
// ─────────────────────────────────────────────────────────────────────────────
function setFilter(cat, btn) {
  document.querySelectorAll('.cat-pill').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentCat = cat;
  filtered   = cat === 'all' ? allArticles : allArticles.filter(a => a.cat === cat);
  shown      = Math.min(4 + PAGE_SIZE, filtered.length);
  render();
}

// ─────────────────────────────────────────────────────────────────────────────
// Load data
// ─────────────────────────────────────────────────────────────────────────────
async function init() {
  try {
    const res  = await fetch(DATA_URL + '?v=' + Date.now());
    if (!res.ok) throw new Error(res.statusText);
    const data = await res.json();
    allArticles = (data.articles || []).filter(a => a.title && a.url);
    ARTICLES    = allArticles;
    filtered    = allArticles;
    shown       = Math.min(4 + PAGE_SIZE, filtered.length);

    const d = new Date(data.updated);
    const label = isNaN(d)
      ? 'Updated'
      : d.toLocaleString('vi-VN', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
    document.getElementById('update-label').innerHTML = `Cập nhật: <b>${label}</b>`;

    render();
  } catch(err) {
    document.getElementById('main').innerHTML = `
      <div class="state-box">
        <p>⚠️ Không thể tải tin tức.<br>
           <small style="color:var(--text-meta)">${err.message}</small></p>
      </div>`;
  }
}

init();

// ═════════════════════════════════════════════════════════════════════════════
// DICTIONARY — bôi đen để tra từ
// ═════════════════════════════════════════════════════════════════════════════
const dictPopup  = document.getElementById('dict-popup');
const dictWord   = document.getElementById('dict-word');
const dictPhone  = document.getElementById('dict-phonetic');
const dictBody   = document.getElementById('dict-body');
let   dictActive = false;

// Cache để tránh gọi API lại với từ đã tra
const dictCache  = {};

function closeDict() {
  dictPopup.classList.remove('visible');
  dictActive = false;
}

function positionPopup(rect) {
  const GAP = 10;
  const pw  = dictPopup.offsetWidth  || 300;
  const ph  = dictPopup.offsetHeight || 200;
  const vw  = window.innerWidth;
  const vh  = window.innerHeight;

  // Ưu tiên hiện TRÊN selection, nếu không đủ chỗ thì hiện DƯỚI
  let top  = rect.top - ph - GAP;
  if (top < 8) top = rect.bottom + GAP;

  // Căn giữa theo chiều ngang, giữ trong viewport
  let left = rect.left + rect.width / 2 - pw / 2;
  left = Math.max(8, Math.min(left, vw - pw - 8));

  dictPopup.style.top  = `${top}px`;
  dictPopup.style.left = `${left}px`;
}

async function lookupWord(query, rect) {
  const q = query.trim();
  if (!q || q.length > 120) return;

  // Hiện popup với loading state
  dictWord.textContent  = q;
  dictPhone.textContent = '';
  dictBody.innerHTML    = '<div class="dict-loading"><div class="spinner"></div> Đang tra...</div>';
  dictPopup.classList.add('visible');
  dictActive = true;

  // Định vị (sau khi visible để có kích thước thực)
  requestAnimationFrame(() => positionPopup(rect));

  // Dùng cache nếu có
  if (dictCache[q]) { renderDict(dictCache[q]); return; }

  // Gọi song song 2 API
  const isSingleWord = !/\s/.test(q);
  const [dictRes, transRes] = await Promise.allSettled([
    isSingleWord
      ? fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(q)}`)
          .then(r => r.ok ? r.json() : null).catch(() => null)
      : Promise.resolve(null),
    fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(q)}&langpair=en|vi`)
      .then(r => r.ok ? r.json() : null).catch(() => null),
  ]);

  const dictData  = dictRes.status  === 'fulfilled' ? dictRes.value  : null;
  const transData = transRes.status === 'fulfilled' ? transRes.value : null;

  const result = { query: q, dictData, transData };
  dictCache[q] = result;
  renderDict(result);
}

function renderDict({ query, dictData, transData }) {
  // Phiên âm từ Dictionary API
  let phonetic = '';
  if (Array.isArray(dictData) && dictData[0]) {
    const entry = dictData[0];
    phonetic = entry.phonetic
      || (entry.phonetics || []).find(p => p.text)?.text
      || '';
  }
  dictPhone.textContent = phonetic;

  // Bản dịch tiếng Việt
  const viText = transData?.responseData?.translatedText || '';

  // Meanings (tối đa 2 từ loại, mỗi loại 1 definition)
  let meaningsHTML = '';
  if (Array.isArray(dictData) && dictData[0]?.meanings?.length) {
    const meanings = dictData[0].meanings.slice(0, 2);
    meaningsHTML = meanings.map(m => {
      const def  = m.definitions?.[0];
      if (!def) return '';
      const exHTML = def.example
        ? `<div class="dict-example">${esc(def.example)}</div>`
        : '';
      return `
        <div class="dict-meaning">
          <span class="dict-pos">${esc(m.partOfSpeech)}</span>
          <div class="dict-def">${esc(def.definition)}</div>
          ${exHTML}
        </div>`;
    }).join('');
  }

  // Nếu không có từ điển entry, chỉ hiện bản dịch
  if (!meaningsHTML && !viText) {
    dictBody.innerHTML = `<div class="dict-error">Không tìm thấy kết quả cho "<em>${esc(query)}</em>"</div>`;
    return;
  }

  dictBody.innerHTML = `
    ${viText ? `
      <div>
        <div class="dict-vi-label">Tiếng Việt</div>
        <div class="dict-vi">${esc(viText)}</div>
      </div>` : ''}
    ${meaningsHTML}`;

  // Định vị lại sau khi nội dung đã render
  const sel = window.getSelection();
  if (sel?.rangeCount) {
    positionPopup(sel.getRangeAt(0).getBoundingClientRect());
  }
}

// ── Event: bôi đen text trong reader body ────────────────────────────────────
function handleSelection() {
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed) {
    // Không có selection — đóng popup nếu không click vào popup
    return;
  }

  const q = sel.toString().trim();
  if (!q || q.length < 2) return;

  // Chỉ hoạt động trong reader body
  const readerBody = document.getElementById('reader-body');
  if (!readerBody) return;
  const range = sel.getRangeAt(0);
  if (!readerBody.contains(range.commonAncestorContainer)) return;

  const rect = range.getBoundingClientRect();
  lookupWord(q, rect);
}

// Dùng mouseup + touchend để bắt cả desktop lẫn mobile
document.addEventListener('mouseup', (e) => {
  // Nếu click vào popup thì bỏ qua
  if (dictPopup.contains(e.target)) return;
  setTimeout(handleSelection, 10);
});
document.addEventListener('touchend', (e) => {
  if (dictPopup.contains(e.target)) return;
  setTimeout(handleSelection, 100); // chờ selection ổn định trên mobile
});

// Click bên ngoài popup → đóng
document.addEventListener('mousedown', (e) => {
  if (dictActive && !dictPopup.contains(e.target)) {
    closeDict();
  }
});

// Escape đóng popup (ưu tiên hơn đóng reader)
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if (dictActive) { closeDict(); return; }
    if (!document.getElementById('reader').hidden) closeReader();
  }
});
</script>
</body>
</html>
