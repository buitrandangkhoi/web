<!DOCTYPE html>
<html lang="vi" data-theme="">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IELTS Exam Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<style>
/* ── TOKENS ─────────────────────────────────────────────────────── */
:root {
  --bg:       #f0f5fb;
  --surface:  #ffffff;
  --surface2: #f7fafd;
  --navy:     #0d2137;
  --blue:     #1a56db;
  --teal:     #0d9488;
  --teal-lt:  rgba(13,148,136,.10);
  --border:   #dce4f0;
  --text:     #0f172a;
  --text2:    #334155;
  --muted:    #637590;
  --subtle:   #9eb0c8;
  --amber:    #d97706;
  --amber-lt: rgba(217,119,6,.10);
  --green:    #16a34a;
  --green-lt: rgba(22,163,74,.10);
  --red:      #dc2626;
  --red-lt:   rgba(220,38,38,.10);
  --shadow-sm: 0 1px 3px rgba(13,33,55,.07), 0 1px 8px rgba(13,33,55,.04);
  --shadow:    0 2px 8px rgba(13,33,55,.09), 0 4px 20px rgba(13,33,55,.06);
  --radius:    12px;
  --ff-ui:     'DM Sans', system-ui, sans-serif;
  --ff-serif:  'Playfair Display', Georgia, 'Times New Roman', serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #081525;
    --surface:  #0e2238;
    --surface2: #0b1c30;
    --border:   #1e3352;
    --text:     #e2ecf8;
    --text2:    #a3bcd8;
    --muted:    #6b88a8;
    --subtle:   #3d5a78;
    --teal-lt:  rgba(13,148,136,.15);
    --amber-lt: rgba(217,119,6,.15);
    --green-lt: rgba(22,163,74,.15);
    --red-lt:   rgba(220,38,38,.15);
    --shadow-sm: 0 1px 3px rgba(0,0,0,.3);
    --shadow:    0 2px 8px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg: #081525; --surface: #0e2238; --surface2: #0b1c30;
  --border: #1e3352; --text: #e2ecf8; --text2: #a3bcd8;
  --muted: #6b88a8; --subtle: #3d5a78;
  --teal-lt: rgba(13,148,136,.15); --amber-lt: rgba(217,119,6,.15);
  --green-lt: rgba(22,163,74,.15); --red-lt: rgba(220,38,38,.15);
  --shadow-sm: 0 1px 3px rgba(0,0,0,.3); --shadow: 0 2px 8px rgba(0,0,0,.4);
}

/* ── RESET / BASE ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--ff-ui);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
button { font-family: inherit; cursor: pointer; border: none; }
a { color: var(--blue); text-decoration: none; }
img { max-width: 100%; }
audio { width: 100%; outline: none; }

/* ── LANDING ────────────────────────────────────────────────────── */
#screen-home {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}
.home-top {
  background: var(--navy);
  padding: 48px 24px 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.home-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(13,148,136,.25);
  color: #5eead4;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .8px;
  text-transform: uppercase;
  padding: 4px 12px;
  border-radius: 99px;
  border: 1px solid rgba(13,148,136,.35);
  margin-bottom: 18px;
}
.home-top h1 {
  font-family: var(--ff-serif);
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 700;
  color: #fff;
  line-height: 1.2;
  text-wrap: balance;
  margin-bottom: 12px;
}
.home-top p {
  color: #90aac8;
  font-size: 15px;
  max-width: 480px;
  font-weight: 300;
}
.skill-filter {
  display: flex;
  gap: 0;
  background: rgba(255,255,255,.07);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.1);
  margin-top: 28px;
  overflow: hidden;
}
.sf-btn {
  flex: 1;
  padding: 9px 20px;
  background: none;
  color: #90aac8;
  font-size: 13px;
  font-weight: 600;
  transition: background .15s, color .15s;
  border-radius: 0;
  white-space: nowrap;
}
.sf-btn:first-child { border-radius: 9px 0 0 9px; }
.sf-btn:last-child  { border-radius: 0 9px 9px 0; }
.sf-btn.active { background: var(--teal); color: #fff; }
.sf-btn:not(.active):hover { background: rgba(255,255,255,.08); color: #fff; }

.home-body {
  flex: 1;
  padding: 32px 24px 48px;
  max-width: 960px;
  margin: 0 auto;
  width: 100%;
}
.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 14px;
}
.test-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 14px;
}
.test-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  box-shadow: var(--shadow-sm);
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.test-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow);
  border-color: var(--teal);
}
.tc-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.skill-pill {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 3px 9px;
  border-radius: 99px;
}
.pill-listening { background: #e0e9ff; color: #1a56db; }
.pill-reading   { background: var(--teal-lt); color: var(--teal); }
.pill-writing   { background: var(--amber-lt); color: var(--amber); }
.tc-arrow { color: var(--subtle); font-size: 16px; transition: transform .15s; }
.test-card:hover .tc-arrow { transform: translateX(3px); }
.tc-name { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
.tc-source { font-size: 12px; color: var(--muted); }
.tc-meta {
  display: flex;
  gap: 14px;
  margin-top: 4px;
  font-size: 12px;
  color: var(--muted);
}
.tc-meta span { display: flex; align-items: center; gap: 4px; }
.tc-meta .dot { color: var(--subtle); }
.hidden-filter { display: none; }

/* ── EXAM TOP BAR ───────────────────────────────────────────────── */
#screen-exam {
  height: 100%;
  display: flex;
  flex-direction: column;
}
.exam-bar {
  background: var(--navy);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
  height: 56px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 40;
}
.back-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,.08);
  color: #c0d4ec;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 8px;
  padding: 6px 12px;
  font-size: 13px;
  font-weight: 500;
  transition: background .15s;
  flex-shrink: 0;
}
.back-btn:hover { background: rgba(255,255,255,.14); }
.exam-title {
  flex: 1;
  font-size: 13px;
  font-weight: 600;
  color: #d8e8f8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.timer-wrap {
  display: flex;
  align-items: center;
  gap: 10px;
  background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 10px;
  padding: 6px 14px;
  flex-shrink: 0;
}
.timer-digits {
  font-size: 18px;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  color: #a8d0f0;
  letter-spacing: .5px;
  min-width: 52px;
  text-align: center;
}
.timer-digits.warn  { color: #fbbf24; }
.timer-digits.danger { color: #f87171; }
.timer-start-btn {
  background: var(--teal);
  color: #fff;
  border-radius: 7px;
  padding: 5px 12px;
  font-size: 12px;
  font-weight: 600;
  transition: background .15s;
}
.timer-start-btn:hover { background: #0c8278; }
.timer-start-btn.running { background: rgba(255,255,255,.12); color: #c0d4ec; }
.submit-btn {
  background: rgba(255,255,255,.1);
  color: #c0d4ec;
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 8px;
  padding: 7px 16px;
  font-size: 13px;
  font-weight: 600;
  transition: background .15s, color .15s;
  flex-shrink: 0;
}
.submit-btn:hover { background: var(--teal); color: #fff; border-color: var(--teal); }

/* ── EXAM LAYOUT ────────────────────────────────────────────────── */
.exam-body {
  flex: 1;
  display: flex;
  overflow: hidden;
}
.exam-sidebar {
  width: 220px;
  min-width: 180px;
  background: var(--surface);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  padding: 20px 14px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}
.sidebar-section h4 {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .8px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}
.q-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
}
.q-box {
  aspect-ratio: 1;
  border-radius: 6px;
  background: var(--bg);
  border: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  cursor: pointer;
  transition: background .12s, color .12s, border-color .12s;
  font-variant-numeric: tabular-nums;
}
.q-box:hover { border-color: var(--blue); color: var(--blue); }
.q-box.answered { background: var(--teal-lt); border-color: var(--teal); color: var(--teal); }
.q-box.correct  { background: var(--green-lt); border-color: var(--green); color: var(--green); }
.q-box.wrong    { background: var(--red-lt); border-color: var(--red); color: var(--red); }
.q-box.current  { border-color: var(--blue); color: var(--blue); background: rgba(26,86,219,.08); }

.skill-info-block {
  background: var(--surface2);
  border-radius: 10px;
  padding: 12px;
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}
.skill-info-block b { color: var(--text2); }

.legend { display: flex; flex-direction: column; gap: 6px; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--muted); }
.legend-dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; }

/* ── EXAM CONTENT ───────────────────────────────────────────────── */
.exam-content { flex: 1; overflow-y: auto; }

/* Passage tabs */
.passage-tabs {
  display: flex;
  gap: 0;
  border-bottom: 2px solid var(--border);
  padding: 0 28px;
  background: var(--surface);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
}
.ptab {
  padding: 13px 20px;
  font-size: 13px;
  font-weight: 600;
  color: var(--muted);
  background: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -2px;
  transition: color .15s, border-color .15s;
}
.ptab:hover { color: var(--teal); }
.ptab.active { color: var(--teal); border-bottom-color: var(--teal); }

/* Reading passage */
.reading-split {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 0;
  height: 100%;
}
.passage-panel {
  padding: 28px 32px;
  overflow-y: auto;
  border-right: 1px solid var(--border);
  max-height: calc(100vh - 56px);
}
.passage-panel h2 {
  font-family: var(--ff-serif);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
  margin-bottom: 20px;
  line-height: 1.35;
  text-wrap: balance;
}
.passage-body {
  font-family: var(--ff-serif);
  font-size: 15px;
  line-height: 1.85;
  color: var(--text2);
}
.passage-body p { margin-bottom: 16px; }
.para-tag {
  display: inline-block;
  font-family: var(--ff-ui);
  font-size: 11px;
  font-weight: 700;
  color: var(--teal);
  background: var(--teal-lt);
  padding: 1px 6px;
  border-radius: 4px;
  margin-right: 6px;
  vertical-align: baseline;
  letter-spacing: .3px;
}
.passage-word-count {
  font-family: var(--ff-ui);
  font-size: 11px;
  color: var(--subtle);
  margin-top: 20px;
  padding-top: 16px;
  border-top: 1px solid var(--border);
}
.vocab-block {
  margin-top: 24px;
  padding: 16px;
  background: var(--surface2);
  border-radius: 10px;
  border: 1px solid var(--border);
}
.vocab-block h4 {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 12px;
}
.vocab-list { display: flex; flex-direction: column; gap: 8px; }
.vocab-row { display: flex; gap: 10px; align-items: baseline; }
.vocab-word { font-weight: 700; font-size: 14px; color: var(--text); min-width: 130px; }
.vocab-ipa { font-size: 12px; color: var(--muted); font-style: italic; min-width: 100px; }
.vocab-vi { font-size: 13px; color: var(--text2); }

/* Question panel (reading) */
.questions-panel {
  padding: 24px 20px;
  overflow-y: auto;
  max-height: calc(100vh - 56px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.q-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow-sm);
}
.q-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .7px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.q-text {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  line-height: 1.5;
  margin-bottom: 12px;
  font-family: var(--ff-serif);
  font-weight: 600;
  font-style: italic;
}
.q-options { display: flex; gap: 7px; flex-wrap: wrap; }
.q-opt {
  padding: 7px 14px;
  border: 1.5px solid var(--border);
  border-radius: 8px;
  background: var(--surface2);
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  cursor: pointer;
  transition: .15s;
}
.q-opt:hover { border-color: var(--teal); color: var(--teal); }
.q-opt.sel { border-color: var(--blue); color: var(--blue); background: rgba(26,86,219,.06); }
.q-opt.correct { border-color: var(--green); color: var(--green); background: var(--green-lt); }
.q-opt.wrong { border-color: var(--red); color: var(--red); background: var(--red-lt); }
.q-exp {
  margin-top: 10px;
  padding: 9px 12px;
  background: var(--green-lt);
  border-radius: 8px;
  font-size: 12px;
  color: var(--green);
  line-height: 1.5;
  display: none;
}
.q-exp.show { display: block; }
.q-no-answer-note {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.7;
}
.q-no-answer-note a { color: var(--blue); }
.check-btn {
  padding: 10px 22px;
  background: var(--teal);
  color: #fff;
  border-radius: 9px;
  font-size: 13px;
  font-weight: 700;
  transition: background .15s;
}
.check-btn:hover { background: #0c8278; }
.reset-link {
  padding: 10px 14px;
  background: none;
  color: var(--muted);
  border: 1px solid var(--border);
  border-radius: 9px;
  font-size: 13px;
  font-weight: 600;
  transition: .15s;
}
.reset-link:hover { background: var(--bg); }

/* Score bar */
.score-bar {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: var(--shadow-sm);
}
.score-num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--teal); }
.score-denom { font-size: 14px; color: var(--muted); }
.score-band { font-size: 14px; font-weight: 700; color: var(--text2); }

/* ── LISTENING LAYOUT ───────────────────────────────────────────── */
.listening-layout {
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
  max-width: 760px;
}
.audio-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
}
.audio-card-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
.audio-card h3 { font-size: 17px; font-weight: 700; color: var(--text); }
.audio-card .ac-sub { font-size: 13px; color: var(--muted); margin-bottom: 16px; }
.audio-card audio { border-radius: 8px; }

.sections-accordion { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
.acc-item {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
}
.acc-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 11px 14px;
  background: var(--surface2);
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  color: var(--text2);
  transition: background .12s;
}
.acc-head:hover { background: var(--teal-lt); }
.acc-body { padding: 12px 14px; font-size: 13px; color: var(--muted); line-height: 1.65; display: none; }
.acc-body.open { display: block; }
.acc-arrow { font-size: 12px; color: var(--subtle); transition: transform .2s; }
.acc-head.open .acc-arrow { transform: rotate(180deg); }

/* IDP audio list */
.idp-list { display: flex; flex-direction: column; gap: 12px; }
.idp-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
}
.idp-type {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--blue);
  margin-bottom: 6px;
}
.idp-card h4 { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.idp-card audio { border-radius: 7px; }

/* ── WRITING LAYOUT ─────────────────────────────────────────────── */
.writing-layout {
  padding: 28px;
  max-width: 740px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.task-num-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: var(--amber-lt);
  color: var(--amber);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .5px;
  text-transform: uppercase;
  padding: 4px 10px;
  border-radius: 99px;
  border: 1px solid rgba(217,119,6,.2);
  margin-bottom: 6px;
}
.task-prompt-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 22px 24px;
  box-shadow: var(--shadow-sm);
}
.task-prompt-card h3 { font-size: 16px; font-weight: 700; margin-bottom: 12px; }
.task-prompt-card .prompt-text {
  font-family: var(--ff-serif);
  font-size: 15px;
  line-height: 1.75;
  color: var(--text2);
}
.task-req-bar {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--amber-lt);
  border: 1px solid rgba(217,119,6,.2);
  border-radius: 9px;
  padding: 10px 16px;
  font-size: 13px;
  color: var(--amber);
  font-weight: 500;
}
.task-req-bar b { font-weight: 700; }
.writing-area {
  background: var(--surface);
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  padding: 18px 20px;
  font-size: 15px;
  font-family: var(--ff-serif);
  line-height: 1.8;
  color: var(--text);
  min-height: 220px;
  width: 100%;
  resize: vertical;
  outline: none;
  transition: border-color .15s;
}
.writing-area:focus { border-color: var(--teal); box-shadow: 0 0 0 3px rgba(13,148,136,.12); }

let _fullPassages = [], _curPassage = 0;
function renderFullPassages(passages) {
  _fullPassages = passages;
  _curPassage = 0;
  renderFullPassage();
}

function renderFullPassage() {
  const p = _fullPassages[_curPassage];
  if (!p) return;

  // Split content into paragraph segments
  const raw = p.content || '';
  // Try split on capital letter paragraph markers
  const segments = raw.match(/[A-H][A-Z][^A-Z]{10,}|[^A-H].{10,}/g) || [raw];

  let passageHtml = '';
  // Actually let's do a simpler split on paragraph markers like "A At..." or "B..."
  const parts = raw.split(/(?=[A-H]\s+[A-Z])/);
  parts.forEach(part => {
    const m = part.match(/^([A-H])\s+(.+)/s);
    if (m) {
      passageHtml += `<p><span class="para-tag">${m[1]}</span>${m[2].trim()}</p>`;
    } else if (part.trim()) {
      passageHtml += `<p>${part.trim()}</p>`;
    }
  });

  const tabs = _fullPassages.map((pp, i) =>
    `<button class="ptab ${i === _curPassage ? 'active' : ''}" onclick="switchFullPassage(${i})">Passage ${pp.passage_number}</button>`
  ).join('');

  const contentHtml = `
    <div style="display:flex;flex-direction:column;height:100%">
      <div class="passage-tabs">${tabs}</div>
      <div class="reading-split" style="flex:1">
        <div class="passage-panel">
          <h2>${(p.title||'').replace(/^A\s+/,'').substring(0,90)}${(p.title||'').length > 90 ? '…' : ''}</h2>
          <div class="passage-body">${passageHtml}</div>
          <div class="passage-word-count">📊 ${p.word_count || ''} words — IELTS Academic Reading Passage ${p.passage_number}</div>
        </div>
        <div class="questions-panel">
          <div class="q-no-answer-note">
            <b style="color:var(--text2)">📝 Bài này chưa có câu hỏi tích hợp</b><br><br>
            Đây là full reading passage chuẩn IELTS. Để làm bài đầy đủ với câu hỏi (True/False/NG, Matching headings…), tải đề tại <a href="https://ieltsonlinetests.com" target="_blank">ieltsonlinetests.com</a>.<br><br>
            <b>Gợi ý:</b> Đọc passage này và ghi chú ý chính mỗi đoạn trước khi xem câu hỏi.
          </div>
          <div class="tip-box" style="margin-top:0">
            ⏱ Mục tiêu: đọc Passage ${p.passage_number} trong <b>20 phút</b>.<br><br>
            ✅ Đọc tiêu đề → paragraph letters → câu đầu mỗi đoạn → chi tiết cần thiết.
          </div>
        </div>
      </div>
    </div>`;
  setContent(contentHtml, false);
}

function switchFullPassage(i) {
  _curPassage = i;
  renderFullPassage();
}

/* ── READING: CAMBRIDGE (with interactive Q) ─────────────── */
function renderReadingCam() {
  camPassages = CAM18.passages;
  const qCount = camPassages.reduce((s,p) => s + (p.questions||[]).length, 0);
  setSidebar(qCount, `<div class="skill-info-block">
    <b>Cambridge IELTS 18</b><br>True / False / Not Given<br><br>
    Chọn TRUE nếu phù hợp, FALSE nếu trái ngược, NOT GIVEN nếu không đề cập.
  </div>`);
  renderCamPassage(0);
}

let _camPassage = 0;
function renderCamPassage(idx) {
  _camPassage = idx;
  const p = camPassages[idx];

  const paraHtml = (p.paragraphs||[]).map(para => {
    const m = para.match(/^\[([A-Z])\]\s(.+)/s);
    if (m) return `<p><span class="para-tag">${m[1]}</span>${m[2].trim()}</p>`;
    return `<p>${para.trim()}</p>`;
  }).join('');

  const vocabHtml = (p.vocabulary||[]).length ? `
    <div class="vocab-block">
      <h4>Từ vựng học thuật</h4>
      <div class="vocab-list">
        ${(p.vocabulary||[]).map(v => `<div class="vocab-row">
          <span class="vocab-word">${v.word}</span>
          <span class="vocab-ipa">${v.ipa}</span>
          <span class="vocab-vi">${v.vi}</span>
        </div>`).join('')}
      </div>
    </div>` : '';

  const allQ = p.questions || [];
  const qs = allQ.map(q => `
    <div class="q-card" id="qcard_${q.n}">
      <div class="q-label">Question ${q.n} · True / False / Not Given</div>
      <div class="q-text">"${q.q}"</div>
      <div class="q-options">
        ${['TRUE','FALSE','NOT GIVEN'].map(o =>
          `<div class="q-opt" id="opt_${q.n}_${o}" onclick="camSelect(${q.n},'${o}')">${o}</div>`
        ).join('')}
      </div>
      <div class="q-exp" id="exp_${q.n}">✅ ${q.exp}</div>
    </div>`).join('');

  const tabs = camPassages.map((pp, i) =>
    `<button class="ptab ${i === _camPassage ? 'active' : ''}" onclick="renderCamPassage(${i})">Passage ${pp.passage_number}</button>`
  ).join('');

  const contentHtml = `
    <div style="display:flex;flex-direction:column;height:100%">
      <div class="passage-tabs">${tabs}</div>
      <div class="reading-split" style="flex:1">
        <div class="passage-panel">
          <h2>${p.title}</h2>
          <div class="passage-body">${paraHtml}</div>
          ${vocabHtml}
        </div>
        <div class="questions-panel">
          <div id="scoreBarCam"></div>
          ${qs}
          <div style="display:flex;gap:8px;flex-wrap:wrap">
            <button class="check-btn" onclick="checkCam()">✅ Kiểm tra đáp án</button>
            <button class="reset-link" onclick="resetCam()">🔄 Làm lại</button>
          </div>
        </div>
      </div>
    </div>`;
  setContent(contentHtml, false);
}

function camSelect(n, opt) {
  if (checked[n]) return;
  answers[n] = opt;
  ['TRUE','FALSE','NOT GIVEN'].forEach(o => {
    document.getElementById(`opt_${n}_${o}`)?.classList.remove('sel');
  });
  document.getElementById(`opt_${n}_${opt}`)?.classList.add('sel');
  // Update Q grid
  updateQGrid();
}

function checkCam() {
  const p = camPassages[_camPassage];
  const qs = p.questions || [];
  let correct = 0;
  qs.forEach(q => {
    const ans = answers[q.n];
    ['TRUE','FALSE','NOT GIVEN'].forEach(o => {
      document.getElementById(`opt_${q.n}_${o}`)?.classList.remove('sel','correct','wrong');
    });
    if (ans) {
      const isRight = ans === q.a;
      document.getElementById(`opt_${q.n}_${ans}`)?.classList.add(isRight ? 'correct' : 'wrong');
      if (!isRight) document.getElementById(`opt_${q.n}_${q.a}`)?.classList.add('correct');
      if (isRight) correct++;
    } else {
      document.getElementById(`opt_${q.n}_${q.a}`)?.classList.add('correct');
    }
    document.getElementById(`exp_${q.n}`)?.classList.add('show');
    checked[q.n] = true;
  });

  const pct = qs.length > 0 ? Math.round((correct/qs.length)*100) : 0;
  const sb = document.getElementById('scoreBarCam');
  if (sb) sb.innerHTML = `<div class="score-bar" style="margin-bottom:4px">
    <div>
      <div style="font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px">Kết quả</div>
      <div style="display:flex;align-items:baseline;gap:4px">
        <span class="score-num">${correct}</span>
        <span class="score-denom">/ ${qs.length} đúng</span>
      </div>
    </div>
    <div class="score-band">${pct}%</div>
  </div>`;
  lastScore = { correct, total: qs.length };
  updateQGrid();
}

function resetCam() {
  answers = {}; checked = {};
  lastScore = null;
  renderCamPassage(_camPassage);
}

function updateQGrid() {
  const p = camPassages ? camPassages[_camPassage] : null;
  if (!p) return;
  const qs = p.questions || [];
  const cells = document.querySelectorAll('#qGrid .q-box');
  cells.forEach((cell, i) => {
    const q = qs[i];
    if (!q) return;
    cell.classList.remove('answered','correct','wrong','current');
    if (checked[q.n]) {
      const isRight = answers[q.n] === q.a;
      cell.classList.add(isRight ? 'correct' : 'wrong');
    } else if (answers[q.n]) {
      cell.classList.add('answered');
    }
  });
}

/* ── WRITING ──────────────────────────────────────────────── */
function renderWriting() {
  setSidebar(null, `<div class="skill-info-block">
    <b>Academic Writing</b><br>Task ${currentTest.task}<br><br>
    Yêu cầu tối thiểu: <b>${currentTest.minWords} từ</b><br>
    Thời gian: <b>${currentTest.duration} phút</b>
  </div>`);

  const promptLines = currentTest.prompt.split('\n').map(l => l.trim()).filter(l => l);
  const promptHtml = promptLines.map((l, i) =>
    i === promptLines.length - 1 && l.match(/^(Summarise|Discuss|Write|To what|Give|Do you)/i)
      ? `<em>${l}</em>` : l
  ).join('<br><br>');

  setContent(`
    <div class="writing-layout">
      <div>
        <div class="task-num-badge">✍️ Task ${currentTest.task}</div>
        <div class="task-prompt-card">
          <h3>Đề bài</h3>
          <div class="prompt-text">${promptHtml}</div>
        </div>
      </div>
      <div class="task-req-bar">
        📌 Tối thiểu <b>${currentTest.minWords} từ</b> &nbsp;·&nbsp; Thời gian <b>${currentTest.duration} phút</b>
      </div>
      <textarea class="writing-area" id="wArea" placeholder="Bắt đầu viết tại đây…" oninput="updateWC()"></textarea>
      <div class="writing-meta">
        <span style="color:var(--muted);font-size:12px">Bài viết tự động lưu khi bạn gõ</span>
        <span class="wc-pill low" id="wcPill">0 / ${currentTest.minWords} từ</span>
      </div>
      <div>
        <h4 style="font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:10px">Tiêu chí chấm điểm</h4>
        <div class="criteria-grid">
          <div class="crit-item"><b>Task Achievement</b><span>Đáp ứng yêu cầu đề bài</span></div>
          <div class="crit-item"><b>Coherence & Cohesion</b><span>Liên kết & mạch lạc</span></div>
          <div class="crit-item"><b>Lexical Resource</b><span>Vốn từ vựng đa dạng</span></div>
          <div class="crit-item"><b>Grammar Range</b><span>Ngữ pháp đa dạng & chính xác</span></div>
        </div>
      </div>
    </div>`);

  // Restore draft
  try {
    const saved = localStorage.getItem('draft_' + currentTest.id);
    if (saved) { document.getElementById('wArea').value = saved; updateWC(); }
  } catch(e) {}
}

function updateWC() {
  const text = document.getElementById('wArea')?.value.trim() || '';
  const count = text ? text.split(/\s+/).filter(Boolean).length : 0;
  const min = currentTest?.minWords || 150;
  const pill = document.getElementById('wcPill');
  if (!pill) return;
  pill.textContent = `${count} / ${min} từ`;
  pill.className = 'wc-pill ' + (count >= min ? 'ok' : count >= min * .8 ? 'close' : 'low');
  try { localStorage.setItem('draft_' + currentTest.id, document.getElementById('wArea').value); } catch(e) {}
}

/* ── SUBMIT / RESULTS ─────────────────────────────────────── */
function submitExam() {
  stopTimer();
  const type = currentTest?.type;

  if (type === 'reading_cam' && lastScore) {
    showResult(lastScore.correct, lastScore.total, 'reading');
  } else if (type === 'writing') {
    const text = document.getElementById('wArea')?.value.trim() || '';
    const wc = text ? text.split(/\s+/).filter(Boolean).length : 0;
    const min = currentTest.minWords;
    showResultWriting(wc, min);
  } else {
    // Generic - no score
    showScreen('results');
    document.getElementById('rEmoji').textContent = '✅';
    document.getElementById('rTitle').textContent = 'Bài thi đã nộp';
    document.getElementById('rSub').textContent = currentTest.title;
    document.getElementById('rStats').innerHTML = '';
  }
}

function showResult(correct, total, skill) {
  const pct = total > 0 ? Math.round((correct/total)*100) : 0;
  showScreen('results');
  document.getElementById('rEmoji').textContent = pct >= 80 ? '🎉' : pct >= 50 ? '💪' : '📖';
  document.getElementById('rTitle').textContent = pct >= 80 ? 'Xuất sắc!' : pct >= 50 ? 'Khá tốt!' : 'Cần ôn thêm';
  document.getElementById('rSub').textContent = `${currentTest.title} — ${pct}% chính xác`;
  document.getElementById('rStats').innerHTML = `
    <div class="rs"><span class="rs-num" style="color:var(--green)">${correct}</span><span class="rs-lbl">Đúng</span></div>
    <div class="rs"><span class="rs-num" style="color:var(--red)">${total-correct}</span><span class="rs-lbl">Sai</span></div>
    <div class="rs"><span class="rs-num" style="color:var(--muted)">${total}</span><span class="rs-lbl">Tổng</span></div>`;
}

function showResultWriting(wc, min) {
  showScreen('results');
  const ok = wc >= min;
  document.getElementById('rEmoji').textContent = ok ? '✅' : '⚠️';
  document.getElementById('rTitle').textContent = ok ? 'Bài viết hoàn thành' : 'Chưa đủ số từ';
  document.getElementById('rSub').textContent = `${currentTest.title}`;
  document.getElementById('rStats').innerHTML = `
    <div class="rs"><span class="rs-num" style="color:${ok?'var(--green)':'var(--amber)'}">${wc}</span><span class="rs-lbl">Số từ</span></div>
    <div class="rs"><span class="rs-num" style="color:var(--muted)">${min}</span><span class="rs-lbl">Yêu cầu</span></div>`;
}

function retake() {
  selectTest(currentTest.id);
}

/* ── TIMER ────────────────────────────────────────────────── */
function toggleTimer() {
  if (timerRunning) { stopTimer(); document.getElementById('timerBtn').textContent = '▶ Tiếp tục'; }
  else startTimer();
}
function startTimer() {
  timerRunning = true;
  document.getElementById('timerBtn').textContent = '⏸ Dừng';
  document.getElementById('timerBtn').classList.add('running');
  timerInt = setInterval(() => {
    timerSec--;
    updateTimerDisplay();
    if (timerSec <= 0) { stopTimer(); alert('⏰ Hết thời gian!'); }
  }, 1000);
}
function stopTimer() {
  timerRunning = false;
  clearInterval(timerInt);
  const btn = document.getElementById('timerBtn');
  if (btn) { btn.textContent = '▶ Tiếp tục'; btn.classList.remove('running'); }
}
function updateTimerDisplay() {
  const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
  const s = String(timerSec % 60).padStart(2, '0');
  const el = document.getElementById('timerVal');
  if (!el) return;
  el.textContent = `${m}:${s}`;
  el.className = 'timer-digits' + (timerSec < 300 ? ' danger' : timerSec < 600 ? ' warn' : '');
}

/* ── HELPERS ──────────────────────────────────────────────── */
function setSidebar(qCount, infoHtml) {
  const grid = document.getElementById('qGrid');
  const info = document.getElementById('sidebarInfo');
  if (qCount && qCount > 0) {
    grid.innerHTML = Array.from({length: qCount}, (_, i) =>
      `<div class="q-box" id="qbox_${i+1}">${i+1}</div>`).join('');
    document.querySelector('.exam-sidebar .sidebar-section:first-child').hidden = false;
  } else {
    grid.innerHTML = '<div style="font-size:12px;color:var(--subtle);padding:4px 2px">–</div>';
  }
  info.innerHTML = infoHtml || '';
}

function setContent(html, scroll = true) {
  document.getElementById('examContent').innerHTML = html;
  if (scroll) document.getElementById('examContent').scrollTop = 0;
}

/* ── INIT ─────────────────────────────────────────────────── */
renderHome();
</script>
